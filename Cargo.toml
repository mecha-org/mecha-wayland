# The `mecha-wayland` facade crate and workspace root. Crates are added to
# `members` as they are rewritten against the new `app` core.
[package]
name = "mecha-wayland"
version = "0.1.0"
edition = "2024"

[dependencies]
animation.workspace = true
app.workspace = true
dbus.workspace = true
atlas = { workspace = true, features = ["svg"] }
geometry.workspace = true
gles.workspace = true
interactivity.workspace = true
layout.workspace = true
paint.workspace = true
presentation.workspace = true
render.workspace = true
ring.workspace = true
timer.workspace = true
wayland.workspace = true
widgets.workspace = true
window.workspace = true
theme.workspace = true
text-input.workspace = true
mechanix-widgets.workspace = true

[dev-dependencies]
libc.workspace = true

[workspace]
members = [
    "crates/app",
    "crates/dbus",
    "crates/animation",
    "crates/atlas",
    "crates/geometry",
    "crates/gles",
    "crates/interactivity",
    "crates/layout",
    "crates/paint",
    "crates/presentation",
    "crates/render",
    "crates/ring",
    "crates/timer",
    "crates/wayland",
    "crates/widgets",
    "crates/window",
    "crates/theme",
    "crates/text-input",
    "crates/mechanix-widgets",
]
resolver = "3"

[workspace.dependencies]
animation = { path = "crates/animation" }
app = { path = "crates/app" }
dbus = { path = "crates/dbus" }
atlas = { path = "crates/atlas" }
geometry = { path = "crates/geometry" }
gles = { path = "crates/gles" }
interactivity = { path = "crates/interactivity" }
layout = { path = "crates/layout" }
paint = { path = "crates/paint" }
presentation = { path = "crates/presentation" }
render = { path = "crates/render" }
ring = { path = "crates/ring" }
timer = { path = "crates/timer" }
wayland = { path = "crates/wayland" }
widgets = { path = "crates/widgets" }
window = { path = "crates/window" }
theme = { path = "crates/theme" }
text-input = { path = "crates/text-input" }
mechanix-widgets = { path = "crates/mechanix-widgets" }
chrono = "0.4"
bitflags = "2"
fontdue = "0.9"
gbm = { version = "0.18", default-features = false }
glow = "0.17"
io-uring = "0.7"
khronos-egl = { version = "6", features = ["dynamic"] }
libc = "0.2"
png = "0.18"
resvg = { version = "0.44", default-features = false }
smallvec = "1"
taffy = { version = "0.10.1", default-features = false, features = [
    "std",
    "flexbox",
    "block_layout",
] }
xkbcommon = "0.9"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
